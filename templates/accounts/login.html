{% extends 'base.html' %}

{% block title %}User Login - MindWell AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%) !important;">
                        <i class="bi bi-person-lock fs-3"></i>
                    </div>
                    <h3 class="font-heading fw-bold mb-1">Welcome to MindWell AI</h3>
                    <p class="text-muted small">Sign in to access your personal wellness dashboard</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label font-heading fw-bold small text-muted">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 py-2.5" placeholder="Enter username" required id="id_username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label font-heading fw-bold small text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 py-2.5" placeholder="Enter password" required id="id_password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-mindwell-primary btn-lg w-100 font-heading fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
