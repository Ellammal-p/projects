version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-depression-risk-analysis-secret-key-2026
      - DB_ENGINE=sqlite
      - ALLOWED_HOSTS=*
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python seed_demo.py &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
